        /* 백링크 모니터링 전용 스타일 */
        .backlink-status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
        }
        
        .backlink-status-working { background-color: #28a745; color: white; }
        .backlink-status-stopped { background-color: #dc3545; color: white; }
        .backlink-status-waiting { background-color: #ffc107; color: #212529; }
        .backlink-status-error { background-color: #fd7e14; color: white; }
        
        .backlink-log-container {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #00ff00;
            border: 1px solid #333;
        }
        
        .backlink-log-line {
            margin-bottom: 5px;
            white-space: nowrap;
        }
        
        .backlink-log-timestamp {
            color: #888;
        }
        
        .backlink-log-info { color: #00ff00; }
        .backlink-log-warning { color: #ffaa00; }
        .backlink-log-error { color: #ff4444; }
        .backlink-log-success { color: #44ff44; }
        
        .backlink-stats-card {
            transition: transform 0.2s;
        }
        
        .backlink-stats-card:hover {
            transform: translateY(-2px);
        }
        
        .backlink-pulse {
            animation: backlinkPulse 2s infinite;
        }
        
        @keyframes backlinkPulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .backlink-task-item {
            border-left: 4px solid #007bff;
            transition: all 0.3s;
        }
        
        .backlink-task-item:hover {
            background-color: #f8f9fa;
            transform: translateX(5px);
        }
        
        .backlink-progress-custom {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        
        .backlink-control-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            color: white;
        }
        
        .backlink-btn-control {
            margin: 5px;
            min-width: 100px;
        }
/* 설정 모달 전용 스타일 추가 */

    <script>
        // 시뮬레이션 데이터 및 상태
        let systemStatus = 'waiting'; // working, stopped, waiting, error
        let backlinks = [];
        let logs = [];
        let isRunning = false;

        // DOM 요소들
        const elements = {
            sidebar: document.getElementById('sidebar'),
            mainContent: document.getElementById('mainContent'),
            sidebarCollapse: document.getElementById('sidebarCollapse'),
            systemStatus: document.getElementById('systemStatus'),
            totalBacklinks: document.getElementById('totalBacklinks'),
            successCount: document.getElementById('successCount'),
            progressCount: document.getElementById('progressCount'),
            errorCount: document.getElementById('errorCount'),
            logContainer: document.getElementById('logContainer'),
            taskList: document.getElementById('taskList'),
            lastUpdated: document.getElementById('lastUpdated'),
            startBtn: document.getElementById('startBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            stopBtn: document.getElementById('stopBtn'),
            refreshBtn: document.getElementById('refreshBtn'),
            clearLogBtn: document.getElementById('clearLogBtn')
        };

        // 사이드바 토글
        elements.sidebarCollapse.addEventListener('click', function() {
            elements.sidebar.classList.toggle('collapsed');
            elements.mainContent.classList.toggle('expanded');
        });

        // 시스템 상태 업데이트
        function updateSystemStatus(status) {
            systemStatus = status;
            const statusElement = elements.systemStatus;
            statusElement.className = 'badge backlink-status-badge';
            
            switch(status) {
                case 'working':
                    statusElement.classList.add('backlink-status-working', 'backlink-pulse');
                    statusElement.textContent = '작업중';
                    break;
                case 'stopped':
                    statusElement.classList.add('backlink-status-stopped');
                    statusElement.textContent = '중지됨';
                    break;
                case 'waiting':
                    statusElement.classList.add('backlink-status-waiting');
                    statusElement.textContent = '대기중';
                    break;
                case 'error':
                    statusElement.classList.add('backlink-status-error');
                    statusElement.textContent = '오류';
                    break;
            }
        }

        // 로그 추가
        function addLog(type, message) {
            const timestamp = new Date().toLocaleString('ko-KR');
            const logLine = document.createElement('div');
            logLine.className = 'backlink-log-line';
            logLine.innerHTML = `
                <span class="backlink-log-timestamp">[${timestamp}]</span>
                <span class="backlink-log-${type}"> [${type.toUpperCase()}] ${message}</span>
            `;
            
            elements.logContainer.appendChild(logLine);
            elements.logContainer.scrollTop = elements.logContainer.scrollHeight;
            
            // 로그가 너무 많으면 오래된 것 제거
            const logLines = elements.logContainer.children;
            if (logLines.length > 100) {
                elements.logContainer.removeChild(logLines[0]);
            }
        }

        // 백링크 작업 생성
        function createBacklinkTask() {
            const domains = ['blog.naver.com', 'coupang.com', 'naver/blog.com', 'm.blog.naver.com', 'm.coupang.com'];
            const statuses = ['success', 'progress', 'error'];
            
            return {
                id: Date.now() + Math.random(),
                domain: domains[Math.floor(Math.random() * domains.length)],
                url: `https://${domains[Math.floor(Math.random() * domains.length)]}/page${Math.floor(Math.random() * 100)}`,
                status: statuses[Math.floor(Math.random() * statuses.length)],
                progress: Math.floor(Math.random() * 100),
                createdAt: new Date()
            };
        }

        // 작업 목록 업데이트
        function updateTaskList() {
            elements.taskList.innerHTML = '';
            
            backlinks.slice(-10).reverse().forEach(task => {
                const taskDiv = document.createElement('div');
                taskDiv.className = 'backlink-task-item p-3 mb-2 border rounded';
                
                let statusBadge = '';
                let progressBar = '';
                
                switch(task.status) {
                    case 'success':
                        statusBadge = '<span class="badge bg-success">완료</span>';
                        break;
                    case 'progress':
                        statusBadge = '<span class="badge bg-warning">진행중</span>';
                        progressBar = `
                            <div class="backlink-progress-custom mt-2">
                                <div style="width: ${task.progress}%; height: 100%; background-color: #ffc107; border-radius: 4px;"></div>
                            </div>
                            <small class="text-muted">${task.progress}%</small>
                        `;
                        break;
                    case 'error':
                        statusBadge = '<span class="badge bg-danger">오류</span>';
                        break;
                }
                
                taskDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">${task.domain}</h6>
                            <p class="mb-1 text-muted small">${task.url}</p>
                            <small class="text-muted">${task.createdAt.toLocaleString('ko-KR')}</small>
                            ${progressBar}
                        </div>
                        <div>
                            ${statusBadge}
                        </div>
                    </div>
                `;
                
                elements.taskList.appendChild(taskDiv);
            });
        }

        // 통계 업데이트
        function updateStats() {
            const total = backlinks.length;
            const success = backlinks.filter(b => b.status === 'success').length;
            const progress = backlinks.filter(b => b.status === 'progress').length;
            const error = backlinks.filter(b => b.status === 'error').length;
            
            elements.totalBacklinks.textContent = total;
            elements.successCount.textContent = success;
            elements.progressCount.textContent = progress;
            elements.errorCount.textContent = error;
            
            elements.lastUpdated.textContent = `마지막 업데이트: ${new Date().toLocaleString('ko-KR')}`;
        }

        // 차트 초기화
        let progressChart;
        function initChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            progressChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['성공', '진행중', '오류'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // 차트 업데이트
        function updateChart() {
            const success = backlinks.filter(b => b.status === 'success').length;
            const progress = backlinks.filter(b => b.status === 'progress').length;
            const error = backlinks.filter(b => b.status === 'error').length;
            
            progressChart.data.datasets[0].data = [success, progress, error];
            progressChart.update();
        }

        // 시뮬레이션 시작
        function startSimulation() {
            if (isRunning) return;
            
            isRunning = true;
            updateSystemStatus('working');
            addLog('info', '백링크 작업 시작됨');
            
            const interval = setInterval(() => {
                if (!isRunning) {
                    clearInterval(interval);
                    return;
                }
                
                // 새 작업 추가
                if (Math.random() < 0.7) {
                    const newTask = createBacklinkTask();
                    backlinks.push(newTask);
                    addLog('info', `새 백링크 작업 추가: ${newTask.domain}`);
                }
                
                // 기존 작업 상태 업데이트
                backlinks.forEach(task => {
                    if (task.status === 'progress') {
                        if (Math.random() < 0.3) {
                            task.status = Math.random() < 0.8 ? 'success' : 'error';
                            addLog(task.status === 'success' ? 'success' : 'error', 
                                  `${task.domain} 작업 ${task.status === 'success' ? '완료' : '실패'}`);
                        } else {
                            task.progress = Math.min(100, task.progress + Math.floor(Math.random() * 20));
                        }
                    }
                });
                
                updateStats();
                updateTaskList();
                updateChart();
                
                // 랜덤 오류 발생
                if (Math.random() < 0.05) {
                    addLog('warning', '일시적인 네트워크 지연 감지');
                }
                
            }, 2000);
        }

        // 제어 버튼 이벤트
        elements.startBtn.addEventListener('click', () => {
            startSimulation();
            addLog('info', '사용자가 시스템 시작');
        });

        elements.pauseBtn.addEventListener('click', () => {
            isRunning = false;
            updateSystemStatus('waiting');
            addLog('warning', '사용자가 시스템 일시정지');
        });

        elements.stopBtn.addEventListener('click', () => {
            isRunning = false;
            updateSystemStatus('stopped');
            addLog('error', '사용자가 시스템 정지');
        });

        elements.refreshBtn.addEventListener('click', () => {
            updateStats();
            updateTaskList();
            updateChart();
            addLog('info', '데이터 새로고침 완료');
        });

        elements.clearLogBtn.addEventListener('click', () => {
            elements.logContainer.innerHTML = '';
            addLog('info', '로그 기록 초기화됨');
        });

        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            updateSystemStatus('waiting');
            initChart();
            
            // 초기 데이터 생성
            for (let i = 0; i < 5; i++) {
                backlinks.push(createBacklinkTask());
            }
            
            updateStats();
            updateTaskList();
            updateChart();
            
            addLog('success', '백링크 모니터링 시스템 초기화 완료');
            addLog('info', '구글 시트 연동 대기중...');
        });
    </script>
<script>
// 설정 관련 변수
let backlinkSettings = {
    devices: [],
    networks: [],
    antiBotFeatures: [],
    requestDelay: 3,
    maxRetries: 3,
    enableLogging: true
};

// 설정 관련 DOM 요소들
const settingsElements = {
    deviceCheckboxes: document.querySelectorAll('.device-checkbox'),
    networkCheckboxes: document.querySelectorAll('.network-checkbox'),
    antiBotCheckboxes: document.querySelectorAll('.anti-bot-checkbox'),
    requestDelay: document.getElementById('requestDelay'),
    delayValue: document.getElementById('delayValue'),
    maxRetries: document.getElementById('maxRetries'),
    enableLogging: document.getElementById('enableLogging'),
    saveBtn: document.getElementById('saveSettingsBtn'),
    selectAllDevices: document.getElementById('selectAllDevices'),
    deselectAllDevices: document.getElementById('deselectAllDevices')
};

// 설정 초기화
function initializeSettings() {
    // 로컬 스토리지에서 설정 불러오기
    const savedSettings = localStorage.getItem('backlinkSettings');
    if (savedSettings) {
        backlinkSettings = JSON.parse(savedSettings);
        loadSettingsToUI();
    } else {
        // 기본 설정으로 초기화
        loadDefaultSettings();
    }
}

// 기본 설정 로드
function loadDefaultSettings() {
    // 모든 디바이스 체크
    settingsElements.deviceCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    // 모든 네트워크 체크
    settingsElements.networkCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    // 모든 봇 방어 기능 체크
    settingsElements.antiBotCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    updateSettingsFromUI();
}

// UI에서 설정 불러오기
function loadSettingsToUI() {
    // 디바이스 설정
    settingsElements.deviceCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.devices.includes(checkbox.value);
    });
    
    // 네트워크 설정
    settingsElements.networkCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.networks.includes(checkbox.value);
    });
    
    // 봇 방어 설정
    settingsElements.antiBotCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.antiBotFeatures.includes(checkbox.value);
    });
    
    // 기타 설정
    settingsElements.requestDelay.value = backlinkSettings.requestDelay;
    settingsElements.delayValue.textContent = backlinkSettings.requestDelay + '초';
    settingsElements.maxRetries.value = backlinkSettings.maxRetries;
    settingsElements.enableLogging.checked = backlinkSettings.enableLogging;
}

// UI에서 설정 업데이트
function updateSettingsFromUI() {
    // 디바이스 설정
    backlinkSettings.devices = Array.from(settingsElements.deviceCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    // 네트워크 설정
    backlinkSettings.networks = Array.from(settingsElements.networkCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    // 봇 방어 설정
    backlinkSettings.antiBotFeatures = Array.from(settingsElements.antiBotCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    // 기타 설정
    backlinkSettings.requestDelay = parseInt(settingsElements.requestDelay.value);
    backlinkSettings.maxRetries = parseInt(settingsElements.maxRetries.value);
    backlinkSettings.enableLogging = settingsElements.enableLogging.checked;
}

// 설정 저장
function saveSettings() {
    updateSettingsFromUI();
    localStorage.setItem('backlinkSettings', JSON.stringify(backlinkSettings));
    
    addLog('success', '설정이 성공적으로 저장되었습니다');
    addLog('info', `선택된 디바이스: ${backlinkSettings.devices.length}개`);
    addLog('info', `선택된 네트워크: ${backlinkSettings.networks.join(', ')}`);
    addLog('info', `활성화된 방어기술: ${backlinkSettings.antiBotFeatures.length}개`);
    
    // 모달 닫기
    const modal = bootstrap.Modal.getInstance(document.getElementById('settingsModal'));
    modal.hide();
}

// 이벤트 리스너 설정
document.addEventListener('DOMContentLoaded', () => {
    // 기존 초기화 코드...
    
    // 설정 초기화
    initializeSettings();
    
    // 지연시간 슬라이더 이벤트
    settingsElements.requestDelay.addEventListener('input', (e) => {
        settingsElements.delayValue.textContent = e.target.value + '초';
    });
    
    // 전체 선택/해제 버튼
    settingsElements.selectAllDevices.addEventListener('click', () => {
        settingsElements.deviceCheckboxes.forEach(checkbox => {
            checkbox.checked = true;
        });
    });
    
    settingsElements.deselectAllDevices.addEventListener('click', () => {
        settingsElements.deviceCheckboxes.forEach(checkbox => {
            checkbox.checked = false;
        });
    });
    
    // 설정 저장 버튼
    settingsElements.saveBtn.addEventListener('click', saveSettings);
    
    // 설정 모달이 열릴 때 현재 설정 표시
    document.getElementById('settingsModal').addEventListener('show.bs.modal', () => {
        loadSettingsToUI();
    });
});

// 설정 정보를 구글 시트로 전송하는 함수 (나중에 구현)
function sendSettingsToGoogleSheets() {
