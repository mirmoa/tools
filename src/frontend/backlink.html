        .backlink-status-badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 12px;
        }
        
        .backlink-status-working { background-color: #28a745; color: white; }
        .backlink-status-stopped { background-color: #dc3545; color: white; }
        .backlink-status-waiting { background-color: #ffc107; color: #212529; }
        .backlink-status-error { background-color: #fd7e14; color: white; }
        
        .backlink-log-container {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #00ff00;
            border: 1px solid #333;
        }
        
        .backlink-log-line {
            margin-bottom: 5px;
            white-space: nowrap;
        }
        
        .backlink-log-timestamp {
            color: #888;
        }
        
        .backlink-log-info { color: #00ff00; }
        .backlink-log-warning { color: #ffaa00; }
        .backlink-log-error { color: #ff4444; }
        .backlink-log-success { color: #44ff44; }
        
        .backlink-stats-card {
            transition: transform 0.2s;
        }
        
        .backlink-stats-card:hover {
            transform: translateY(-2px);
        }
        
        .backlink-pulse {
            animation: backlinkPulse 2s infinite;
        }
        
        @keyframes backlinkPulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        
        .backlink-task-item {
            border-left: 4px solid #007bff;
            transition: all 0.3s;
        }
        
        .backlink-task-item:hover {
            background-color: #f8f9fa;
            transform: translateX(5px);
        }
        
        .backlink-progress-custom {
            height: 8px;
            background-color: #e9ecef;
            border-radius: 4px;
        }
        
        .backlink-control-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            padding: 20px;
            color: white;
        }
        
        .backlink-btn-control {
            margin: 5px;
            min-width: 100px;
        }

// Google Sheets API 호출
async function fetchGoogleSheetsData(range) {
    try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEETS_CONFIG.spreadsheetId}/values/${range}?key=${GOOGLE_SHEETS_CONFIG.apiKey}`;
        const response = await fetch(url);
        
        if (!response.ok) {
            const errorData = await response.json(); // 오류 메시지를 더 자세히 파싱
            throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.error ? errorData.error.message : 'Unknown error'}`);
        }
        
        const data = await response.json();
        return data.values || [];
    } catch (error) {
        console.error('Google Sheets API 호출 실패:', error);
        throw error;
    }
}

// 새로운 함수: 파이썬 프로그램 상태 로드 (Settings 시트 A1)
async function loadPythonProgramStatus() {
    try {
        const data = await fetchGoogleSheetsData(GOOGLE_SHEETS_CONFIG.settingsStatusCell);
        if (data && data.length > 0 && data[0].length > 0) {
            pythonProgramStatus = data[0][0]; // A1 셀의 값 (예: "RUNNING", "STOPPED", "ERROR")
            return pythonProgramStatus;
        }
        pythonProgramStatus = 'UNKNOWN'; // 값이 없을 경우
        return 'UNKNOWN';
    } catch (error) {
        console.error('파이썬 프로그램 상태 로드 실패:', error);
        pythonProgramStatus = 'FETCH_ERROR';
        return 'FETCH_ERROR';
    }
}

// 백링크 데이터 로드 (파이썬 코드의 시트 순서에 맞게 수정)
async function loadBacklinksData() {
    try {
        const data = await fetchGoogleSheetsData(GOOGLE_SHEETS_CONFIG.backlinksRange);
        
        if (data.length > 1) { // 첫 번째 행은 헤더이므로 스킵
            backlinks = data.slice(1).map((row, index) => {
                // 파이썬에서 정의된 Sheets!A:I 컬럼 순서에 맞게 인덱스 매핑
                // domain (A열), sourceUrl (B열), targetUrl (C열), status (D열), progress (E열),
                // createdAt (F열), completedAt (G열), errorMessage (H열), attempts (I열)
                const domain = row[0] || 'Unknown Domain';
                const sourceUrl = row[1] || '';
                const targetUrl = row[2] || '';
                const status = row[3] ? row[3].toLowerCase() : 'waiting'; // 상태는 소문자로 통일
                const progress = parseInt(row[4]) || 0;
                const createdAt = row[5] || '';
                const completedAt = row[6] || '';
                const errorMessage = row[7] || '';
                const attempts = parseInt(row[8]) || 0;
                
                return {
                    id: index + 1, // 행 번호 (헤더 제외)
                    domain: domain,
                    sourceUrl: sourceUrl,
                    targetUrl: targetUrl,
                    status: status,
                    progress: progress,
                    createdAt: createdAt ? new Date(createdAt) : null,
                    completedAt: completedAt ? new Date(completedAt) : null,
                    errorMessage: errorMessage,
                    attempts: attempts
                };
            });
        } else {
            backlinks = []; // 데이터가 없거나 헤더만 있는 경우
        }
        
        retryCount = 0;
        isConnected = true;
        return true;
    } catch (error) {
        console.error('백링크 데이터 로드 실패:', error);
        isConnected = false;
        throw error;
    }
}

// 로그 데이터 로드 (한 줄씩 추가하도록 수정)
async function loadLogsData() {
    try {
        const data = await fetchGoogleSheetsData(GOOGLE_SHEETS_CONFIG.logsRange);
        
        if (data.length > 1) { // 첫 번째 행은 헤더이므로 스킵
            const newLogs = data.slice(1).map((row, index) => ({
                id: index + 1, // 로그 고유 ID (행 번호)
                timestamp: row[0] || '',
                type: row[1] ? row[1].toLowerCase() : 'info', // 타입은 소문자로 통일
                message: row[2] || '',
                details: row[3] || ''
            }));
            
            // 기존 로그와 비교하여 새로운 로그만 UI에 추가
            for (let i = 0; i < newLogs.length; i++) {
                if (newLogs[i].id > lastLogId) {
                    addLogToUI(newLogs[i].type, newLogs[i].message, newLogs[i].timestamp);
                    lastLogId = newLogs[i].id; // 마지막으로 표시된 로그 ID 업데이트
                }
            }
            logs = newLogs; // 전체 로그 데이터는 최신으로 유지
        }
        
        return true;
    } catch (error) {
        console.error('로그 데이터 로드 실패:', error);
        throw error;
    }
}

// 시스템 상태 결정 (파이썬 프로그램 상태를 기반으로 업데이트)
function determineSystemStatus() {
    if (pythonProgramStatus.includes('ERROR')) {
        return 'error';
    }
    if (pythonProgramStatus === 'STOPPED') {
        return 'stopped';
    }
    if (pythonProgramStatus === 'PAUSED') {
        return 'paused'; // '일시정지' 상태 추가
    }
    if (pythonProgramStatus === 'RUNNING' || pythonProgramStatus === 'STARTING') {
        // 파이썬이 실행 중인 경우, 백링크 작업 진행 상태를 확인
        const progressTasks = backlinks.filter(b => b.status === 'progress' || b.status === 'working');
        if (progressTasks.length > 0) {
            return 'working';
        } else {
            return 'waiting'; // 파이썬은 돌고 있지만 작업이 없는 상태
        }
    }
    // API 연결 문제 또는 알 수 없는 상태
    if (!isConnected || pythonProgramStatus === 'FETCH_ERROR' || pythonProgramStatus === 'UNKNOWN') {
        return 'error';
    }
    return 'waiting';
}


// 시스템 상태 업데이트 (badge class 및 text 수정)
function updateSystemStatus(status = null) {
    if (status === null) {
        status = determineSystemStatus();
    }
    
    systemStatus = status;
    const statusElement = elements.systemStatus;
    statusElement.className = 'badge backlink-status-badge'; // 모든 클래스 초기화
    
    switch(status) {
        case 'working':
            statusElement.classList.add('backlink-status-working', 'backlink-pulse');
            statusElement.textContent = '작업중';
            break;
        case 'stopped':
            statusElement.classList.add('backlink-status-stopped');
            statusElement.textContent = '중지됨';
            break;
        case 'paused': // 일시정지 상태 추가
            statusElement.classList.add('backlink-status-paused');
            statusElement.textContent = '일시정지';
            break;
        case 'waiting':
            statusElement.classList.add('backlink-status-waiting');
            statusElement.textContent = '대기중';
            break;
        case 'error':
            statusElement.classList.add('backlink-status-error');
            statusElement.textContent = '오류 발생'; // 더 명확한 오류 메시지
            break;
        case 'UNKNOWN': // 파이썬 상태를 알 수 없을 때 (예: 처음 로드 시)
            statusElement.classList.add('backlink-status-waiting');
            statusElement.textContent = '상태 확인중';
            break;
        case 'FETCH_ERROR': // API 호출 실패 시
            statusElement.classList.add('backlink-status-error');
            statusElement.textContent = 'API 연결 오류';
            break;
    }
}

// UI에 로그 추가 (기존과 동일)
function addLogToUI(type, message, timestamp = null) {
    const logTimestamp = timestamp || new Date().toLocaleString('ko-KR');
    const logLine = document.createElement('div');
    logLine.className = 'backlink-log-line';
    logLine.innerHTML = `
        <span class="backlink-log-timestamp">[${logTimestamp}]</span>
        <span class="backlink-log-${type}"> [${type.toUpperCase()}] ${message}</span>
    `;
    
    elements.logContainer.appendChild(logLine);
    elements.logContainer.scrollTop = elements.logContainer.scrollHeight;
    
    const logLines = elements.logContainer.children;
    if (logLines.length > 100) { // 로그가 너무 많으면 오래된 로그 삭제
        elements.logContainer.removeChild(logLines[0]);
    }
}

// 로컬 로그 추가 (기존과 동일)
function addLocalLog(type, message) {
    addLogToUI(type, message);
}

// 작업 목록 업데이트 (모든 내역을 표시하도록 수정)
function updateTaskList() {
    elements.taskList.innerHTML = '';
    
    // 가장 최근 작업이 위로 오도록 정렬 (옵션: .reverse() 제거 시 oldest first)
    const sortedBacklinks = [...backlinks].sort((a, b) => {
        if (!a.createdAt || !b.createdAt) return 0; // 날짜 없으면 정렬 안 함
        return b.createdAt.getTime() - a.createdAt.getTime(); // 최신 날짜가 위로
    });

    if (sortedBacklinks.length === 0) {
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'text-center text-muted p-4';
        emptyDiv.innerHTML = '<i class="bx bx-inbox" style="font-size: 2rem;"></i><br>작업이 없습니다.';
        elements.taskList.appendChild(emptyDiv);
        return;
    }
    
    sortedBacklinks.forEach(task => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'backlink-task-item p-3 mb-2 border rounded';
        
        let statusBadge = '';
        let progressBar = '';
        
        switch(task.status) {
            case 'success':
            case 'completed':
                statusBadge = '<span class="badge bg-success">완료</span>';
                break;
            case 'progress':
            case 'working':
                statusBadge = '<span class="badge bg-warning">진행중</span>';
                progressBar = `
                    <div class="progress mt-2" style="height: 6px;">
                        <div class="progress-bar bg-warning" style="width: ${task.progress}%"></div>
                    </div>
                    <small class="text-muted">${task.progress}%</small>
                `;
                break;
            case 'error':
            case 'failed':
                statusBadge = '<span class="badge bg-danger">실패</span>';
                break;
            case 'waiting':
                statusBadge = '<span class="badge bg-secondary">대기중</span>';
                break;
            default:
                statusBadge = '<span class="badge bg-light text-dark">알 수 없음</span>';
        }
        
        const errorInfo = task.errorMessage ? 
            `<small class="text-danger d-block">오류: ${task.errorMessage}</small>` : '';
        
        taskDiv.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1 flex-shrink-1"> <h6 class="mb-1">${task.domain}</h6>
                    <p class="mb-1 text-muted small text-truncate-url">소스: ${task.sourceUrl}</p>
                    <p class="mb-1 text-muted small text-truncate-url">타겟: ${task.targetUrl}</p>
                    <small class="text-muted">시작: ${task.createdAt ? task.createdAt.toLocaleString('ko-KR') : 'N/A'}</small><br>
                    ${task.completedAt ? `<small class="text-muted">완료: ${task.completedAt.toLocaleString('ko-KR')}</small><br>` : ''}
                    ${task.attempts > 1 ? `<small class="text-info">시도: ${task.attempts}회</small>` : ''}
                    ${errorInfo}
                    ${progressBar}
                </div>
                <div class="flex-shrink-0 ms-2"> ${statusBadge}
                </div>
            </div>
        `;
        
        elements.taskList.appendChild(taskDiv);
    });
}

// 통계 업데이트 (기존과 동일)
function updateStats() {
    const total = backlinks.length;
    const success = backlinks.filter(b => ['success', 'completed'].includes(b.status)).length;
    const progress = backlinks.filter(b => ['progress', 'working'].includes(b.status)).length;

// 차트 초기화 (기존과 동일)
let progressChart;
function initChart() {
    const ctx = document.getElementById('progressChart').getContext('2d');
    progressChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['성공', '진행중', '오류', '대기중'],
            datasets: [{
                data: [0, 0, 0, 0],
                backgroundColor: ['#28a745', '#ffc107', '#dc3545', '#6c757d']
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom'
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const label = context.label || '';
                            const value = context.parsed;
                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                            return `${label}: ${value}개 (${percentage}%)`;
                        }
                    }
                }
            }
        }
    });
}

// 차트 업데이트 (기존과 동일)
function updateChart() {
    const success = backlinks.filter(b => ['success', 'completed'].includes(b.status)).length;
    const progress = backlinks.filter(b => ['progress', 'working'].includes(b.status)).length;
    const error = backlinks.filter(b => ['error', 'failed'].includes(b.status)).length;
    const waiting = backlinks.filter(b => b.status === 'waiting').length;
    
    progressChart.data.datasets[0].data = [success, progress, error, waiting];
    progressChart.update('none');
}

// 데이터 새로고침
async function refreshData() {
    try {
        //addLocalLog('info', '데이터 새로고침 시작...');
        
        // 파이썬 프로그램 상태를 가장 먼저 로드
        await loadPythonProgramStatus(); 
        
        await loadBacklinksData();
        await loadLogsData();
        
        updateSystemStatus(); // 파이썬 상태를 기반으로 전체 시스템 상태 업데이트
        updateStats();
        updateTaskList();
        updateChart();
        
        //addLocalLog('success', '데이터 새로고침 완료');
        
        // 파이썬 프로그램 상태에 따라 폴링을 제어
        if (['STOPPED', 'ERROR', 'FETCH_ERROR', 'UNKNOWN'].includes(pythonProgramStatus)) {
            stopPolling(); // 파이썬이 실행 중이 아니면 폴링 중지
            addLocalLog('warning', `파이썬 프로그램이 '${pythonProgramStatus}' 상태입니다. 모니터링이 자동 중지됩니다.`, 'control');
        } else if (!pollingInterval) { // 파이썬이 실행 중인데 폴링이 중지되어 있다면 다시 시작
            startPolling();
        }

        retryCount = 0; // 성공적으로 로드했으니 재시도 횟수 초기화
        
    } catch (error) {
        retryCount++;
        const errorMsg = `데이터 로드 실패 (${retryCount}/${MAX_RETRY}): ${error.message}`;
        addLocalLog('error', errorMsg);
        
        if (retryCount < MAX_RETRY) {
            addLocalLog('warning', `5초 후 재시도...`);
            // setTimeout(refreshData, 5000); // refreshData가 startPolling/stopPolling 내부에서 호출되므로 필요 없음
        } else {
            addLocalLog('error', '최대 재시도 횟수 초과. 수동으로 새로고침하거나 API 연결을 확인해주세요.');
            updateSystemStatus('error'); // 오류 상태 표시
            stopPolling(); // 최대 재시도 후에도 실패하면 폴링 중지
        }
    }
}

// 자동 폴링 시작 (10초 간격)
function startPolling() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
    }
    
    pollingInterval = setInterval(refreshData, 10000); // 10초로 변경
    addLocalLog('info', '자동 데이터 폴링 시작 (5초 간격)');
}

// 자동 폴링 중지 (기존과 동일)
function stopPolling() {
    if (pollingInterval) {
        clearInterval(pollingInterval);
        pollingInterval = null;
        addLocalLog('warning', '자동 데이터 폴링 중지');
    }
}

// 설정 초기화 (기존과 동일)
function initializeSettings() {
    try {
        const savedSettings = localStorage.getItem('backlinkSettings');
        if (savedSettings) {
            backlinkSettings = JSON.parse(savedSettings);
            loadSettingsToUI();
        } else {
            loadDefaultSettings();
        }
    } catch (error) {
        console.error('설정 로드 실패:', error);
        loadDefaultSettings();
    }
}

// 기본 설정 로드 (기존과 동일)
function loadDefaultSettings() {
    settingsElements.deviceCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    settingsElements.networkCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    settingsElements.antiBotCheckboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
    
    updateSettingsFromUI();
}

// UI에서 설정 불러오기 (기존과 동일)
function loadSettingsToUI() {
    settingsElements.deviceCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.devices.includes(checkbox.value);
    });
    
    settingsElements.networkCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.networks.includes(checkbox.value);
    });
    
    settingsElements.antiBotCheckboxes.forEach(checkbox => {
        checkbox.checked = backlinkSettings.antiBotFeatures.includes(checkbox.value);
    });
    
    settingsElements.requestDelay.value = backlinkSettings.requestDelay;
    settingsElements.delayValue.textContent = backlinkSettings.requestDelay + '초';
    settingsElements.maxRetries.value = backlinkSettings.maxRetries;
    settingsElements.enableLogging.checked = backlinkSettings.enableLogging;
}

// UI에서 설정 업데이트 (기존과 동일)
function updateSettingsFromUI() {
    backlinkSettings.devices = Array.from(settingsElements.deviceCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    backlinkSettings.networks = Array.from(settingsElements.networkCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    backlinkSettings.antiBotFeatures = Array.from(settingsElements.antiBotCheckboxes)
        .filter(checkbox => checkbox.checked)
        .map(checkbox => checkbox.value);
    
    backlinkSettings.requestDelay = parseInt(settingsElements.requestDelay.value);
    backlinkSettings.maxRetries = parseInt(settingsElements.maxRetries.value);
    backlinkSettings.enableLogging = settingsElements.enableLogging.checked;
}

// 설정 저장 (기존과 동일)
function saveSettings() {
    try {
        updateSettingsFromUI();
        localStorage.setItem('backlinkSettings', JSON.stringify(backlinkSettings));
        
        addLocalLog('success', '설정이 성공적으로 저장되었습니다');
        addLocalLog('info', `선택된 디바이스: ${backlinkSettings.devices.length}개`);
        addLocalLog('info', `선택된 네트워크: ${backlinkSettings.networks.join(', ')}`);
        addLocalLog('info', `활성화된 방어기술: ${backlinkSettings.antiBotFeatures.length}개`);
        addLocalLog('info', `요청 지연시간: ${backlinkSettings.requestDelay}초`);
        addLocalLog('info', `최대 재시도: ${backlinkSettings.maxRetries}회`);
        
        // 모달 닫기
        const modal = bootstrap.Modal.getInstance(document.getElementById('settingsModal'));
        if (modal) {
            modal.hide();
        }
    } catch (error) {
        addLocalLog('error', '설정 저장 실패: ' + error.message);
    }
}

// API 키 검증 (기존과 동일)
function validateApiKey() {
    if (!GOOGLE_SHEETS_CONFIG.apiKey || GOOGLE_SHEETS_CONFIG.apiKey === 'AIzaSyCsPnfG3VbHUFaxwIa0X8omqM9Gtql72WE') {
        addLocalLog('error', 'Google Sheets API 키가 설정되지 않았거나 기본값입니다.');
        addLocalLog('warning', 'GOOGLE_SHEETS_CONFIG.apiKey를 실제 API 키로 변경해주세요.');
        return false;
    }
    return true;
}

// 이벤트 리스너 설정
document.addEventListener('DOMContentLoaded', async () => {
    addLocalLog('info', '백링크 모니터링 시스템 초기화 중...');
    /*
    // API 키 검증
    if (!validateApiKey()) {
        updateSystemStatus('error');
        return;
    }
    */
    // 차트 초기화
    initChart();
    
    // 설정 초기화
    initializeSettings();
    
    // 제어 버튼 이벤트 (버튼 동작은 모니터링 자체에만 영향을 줌)
    elements.startBtn.addEventListener('click', () => {
        addLocalLog('info', '모니터링 시작 (파이썬 프로그램은 별도로 실행되어야 합니다)');
        // 파이썬 프로그램의 실제 상태와 무관하게 UI 모니터링 시작 요청
        startPolling(); 
    });

    elements.pauseBtn.addEventListener('click', () => {
        stopPolling();
        addLocalLog('warning', '모니터링 일시정지');
    });

    elements.stopBtn.addEventListener('click', () => {
        stopPolling();
        addLocalLog('error', '모니터링 중지');
    });

    elements.refreshBtn.addEventListener('click', () => {
        refreshData(); // 수동 새로고침
    });

    elements.clearLogBtn.addEventListener('click', () => {
        elements.logContainer.innerHTML = '';
        lastLogId = 0; // 로그 ID 초기화
        addLocalLog('info', '로컬 로그 화면 초기화됨 (구글 시트 로그는 유지됨)');
    });
    
    // 설정 관련 이벤트
    if (settingsElements.requestDelay) {
        settingsElements.requestDelay.addEventListener('input', (e) => {
            settingsElements.delayValue.textContent = e.target.value + '초';
        });
    }
    
    if (settingsElements.selectAllDevices) {
        settingsElements.selectAllDevices.addEventListener('click', () => {
            settingsElements.deviceCheckboxes.forEach(checkbox => {
                checkbox.checked = true;
            });
        });
    }
    
    if (settingsElements.deselectAllDevices) {
        settingsElements.deselectAllDevices.addEventListener('click', () => {
            settingsElements.deviceCheckboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
        });
    }
    
    if (settingsElements.saveBtn) {
        settingsElements.saveBtn.addEventListener('click', saveSettings);
    }
    
    // 설정 모달 이벤트
    const settingsModal = document.getElementById('settingsModal');
    if (settingsModal) {
        settingsModal.addEventListener('show.bs.modal', () => {
            loadSettingsToUI();
        });
    }
    
    // 초기 데이터 로드 및 파이썬 상태에 따른 폴링 시작/중지
    try {
        await refreshData(); // 최초 한 번 데이터 로드 및 파이썬 상태 확인
        addLocalLog('success', '백링크 모니터링 시스템 초기화 완료');
        // refreshData 함수 내에서 파이썬 상태에 따라 startPolling/stopPolling이 호출됩니다.
        
    } catch (error) {
        addLocalLog('error', '초기화 실패: ' + error.message);
        updateSystemStatus('error'); // 초기화 실패 시 에러 상태
    }
});

// 페이지 언로드 시 폴링 정리 (기존과 동일)
window.addEventListener('beforeunload', () => {
    stopPolling();
});
</script>

</body>
</html>
