name: Test Login Debug
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: pip install selenium webdriver_manager
    
    - name: Run test
      env:
        TZ: "Asia/Seoul"
      run: python src/collector/logind_err_1202.py
    
    - name: Save screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: login-debug-screenshots
        path: log/
