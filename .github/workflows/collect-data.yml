name: Collect Coupang Ads Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Chrome
      run: |
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install dependencies
      run: pip install selenium webdriver_manager

    - name: Run collector
      uses: nick-fields/retry@v2
      env:
        TZ: "Asia/Seoul"
      with:
        timeout_minutes: 15
        max_attempts: 3
        retry_wait_seconds: 60
        command: python src/collector/coupang_login.py

    - name: Save logs (even on failure)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: log/

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add src/frontend/public/data/daily/
        git commit -m "광고비 데이터 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" || exit 0
        git push
